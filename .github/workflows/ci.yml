name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazillka/deckyhub-plugin
          path: deckyhub-plugin
      # DeckyHub's own parser and v1 schema test, run against this repository's file.
      - run: python3 -m unittest tests.test_registry_schema
        working-directory: deckyhub-plugin
        env:
          DECKYHUB_REGISTRY: ${{ github.workspace }}/registry/apps.json
