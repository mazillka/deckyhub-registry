name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # Weekly too: a plugin's new release can break its entry with no change here.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazillka/deckyhub-plugin
          path: deckyhub-plugin
      # DeckyHub's own parser and v1 schema test, run against this repository's file.
      - run: python3 -m unittest tests.test_registry_schema
        working-directory: deckyhub-plugin
        env:
          DECKYHUB_REGISTRY: ${{ github.workspace }}/registry/apps.json
      # Includes the catalog's script check (Node) and the stats.json fields that the
      # DeckyHub people run (deckyhub-plugin's default branch) reads.
      - run: python3 -m unittest discover -s tests
        env:
          DECKYHUB_PLUGIN: ${{ github.workspace }}/deckyhub-plugin
      # Each entry against its repository: releases, asset filter, plugin.json name.
      - run: python3 scripts/validate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
