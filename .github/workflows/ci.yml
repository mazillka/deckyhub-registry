name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # Weekly too: a plugin's new release can break its entry with no change here.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazillka/deckyhub-plugin
          path: deckyhub-plugin
      # The browser extension reads stats.json too; tests/test_schemas.py checks its fields.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazillka/deckyhub-ext
          path: deckyhub-ext
      # deckyhub.com explains every warning; tests/test_docs.py checks that none is missing there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazillka/deckyhub-site
          path: deckyhub-site
      - run: python3 -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # DeckyHub's own parser and v1 schema test, run against this repository's file.
      - run: python3 -m unittest tests.test_registry_schema
        working-directory: deckyhub-plugin
        env:
          DECKYHUB_REGISTRY: ${{ github.workspace }}/registry/apps.json
      # Includes the catalog's script check (Node) and the stats.json fields that the
      # DeckyHub people run (deckyhub-plugin's default branch) reads.
      - run: python3 -m unittest discover -s tests
        env:
          DECKYHUB_PLUGIN: ${{ github.workspace }}/deckyhub-plugin
          DECKYHUB_EXT: ${{ github.workspace }}/deckyhub-ext
          DECKYHUB_SITE: ${{ github.workspace }}/deckyhub-site
      # Each entry against its repository: releases, asset filter, plugin.json name.
      - if: github.event_name == 'pull_request'
        run: |
          git show HEAD^1:registry/apps.json > "$RUNNER_TEMP/base-registry.json"
          python3 scripts/validate.py --base-registry "$RUNNER_TEMP/base-registry.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # What was read from each ZIP before (a release's ZIP never changes) is kept between runs, so
      # only new releases are downloaded. The weekly run reads everything again, to catch a changed ZIP.
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zip-reads.json
          key: zip-reads-${{ github.run_id }}
          restore-keys: zip-reads-
      # A push that changes neither the list nor what checks it (docs, tests, other workflows)
      # can't change the answer: it's the weekly run and a manual start that catch a plugin's
      # new release breaking its entry.
      - if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = push ] && ! git diff --name-only HEAD^1 HEAD | grep -qE '^(registry/apps\.json|README\.md|scripts/|\.github/workflows/ci\.yml)'; then
            echo "Nothing the entries are checked with changed; only the offline checks run."
            python3 scripts/validate.py --offline
            exit 0
          fi
          python3 scripts/validate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_CACHE: ${{ github.event_name != 'schedule' && format('{0}/zip-reads.json', runner.temp) || '' }}
      # Entries that look unfinished (scripts/quality.py), in the run's summary: a list to judge, never a failure.
      - if: github.event_name == 'schedule'
        run: |
          { echo "### Entries that look unfinished"; echo; echo '```'; python3 scripts/quality.py || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
