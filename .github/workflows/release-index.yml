name: Release index

# Publishes releases.json and stats.json (scripts/build_release_index.py), which DeckyHub
# reads instead of asking GitHub's API once per listed repo: main's on the release-index
# branch for everyone, develop's on release-index-develop for DeckyHub's pre-release
# registry setting. Neither branch is protected, so this job can replace each one's
# single commit every run.
on:
  push:
    branches: [main, develop]
    paths: [registry/apps.json, scripts/build_release_index.py]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  # For the audit warning issue.
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A push rebuilds its own branch's index; the schedule and a manual run do both.
        branch: ${{ fromJSON(github.event_name == 'push' && format('["{0}"]', github.ref_name) || '["main", "develop"]') }}
    concurrency:
      group: release-index-${{ matrix.branch }}
      cancel-in-progress: true
    env:
      TARGET: ${{ matrix.branch == 'main' && 'release-index' || 'release-index-develop' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
      # develop with the same list and script as main would publish the same index: copy
      # main's (at most one run older) instead of spending the shared token's GraphQL budget twice.
      - id: same
        if: matrix.branch == 'develop'
        run: |
          git fetch -q --depth 1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- registry/apps.json scripts/; then
            git fetch -q --depth 1 origin release-index
            mkdir -p "$RUNNER_TEMP/index"
            for file in releases.json stats.json; do git show "FETCH_HEAD:$file" > "$RUNNER_TEMP/index/$file"; done
            echo "copied=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.same.outputs.copied != 'true'
        run: python3 scripts/build_release_index.py "$RUNNER_TEMP/index"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # One rolling "Audit warnings" issue (scripts/audit_alerts.py), edited in place: what
      # changed since the last published stats.json first, then every plugin's current
      # warnings. Created or reopened when needed, closed when nothing is flagged. Only for
      # main, what people get. Never blocks publishing: DeckyHub reads this index.
      - if: matrix.branch == 'main'
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin release-index && git show FETCH_HEAD:stats.json > "$RUNNER_TEMP/old-stats.json" || echo '{}' > "$RUNNER_TEMP/old-stats.json"
          action=$(python3 scripts/audit_alerts.py "$RUNNER_TEMP/old-stats.json" "$RUNNER_TEMP/index/stats.json" "$RUNNER_TEMP/alerts.md")
          title=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from audit_alerts import ISSUE_TITLE; print(ISSUE_TITLE)')
          read -r number state < <(gh issue list --state all --limit 200 --json number,title,state --jq "map(select(.title == \"$title\")) | sort_by(.number) | last | \"\(.number) \(.state)\"" || true)
          [[ "$number" == null ]] && number=""
          echo "action=$action issue=${number:-none} state=${state:-}"
          if [[ "$action" == clear ]]; then
            [[ -n "$number" && "$state" == OPEN ]] || exit 0
            gh issue edit "$number" --body-file "$RUNNER_TEMP/alerts.md"
            gh issue close "$number" --reason completed --comment "No listed plugin has an audit warning any more."
          elif [[ -z "$number" ]]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/alerts.md"
          # Closed by hand with nothing new: leave it closed until the warnings change.
          elif [[ "$action" == changed ]]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/alerts.md"
            [[ "$state" == OPEN ]] || gh issue reopen "$number" --comment "Audit warnings are back; the body lists them."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # One orphan commit, force-pushed, so the branch never grows a history.
      - run: |
          git checkout --orphan "$TARGET"
          git rm -rfq .
          cp "$RUNNER_TEMP"/index/*.json .
          git add releases.json stats.json
          git -c user.name="github-actions[bot]" -c user.email="41898341+github-actions[bot]@users.noreply.github.com" commit -qm "Release index ($MATRIX_BRANCH)"
          git push -fq origin "$TARGET"
        env:
          MATRIX_BRANCH: ${{ matrix.branch }}
