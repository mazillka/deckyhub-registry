name: Registry release

# Publishes registry/apps.json as a file on a GitHub release, which DeckyHub reads before
# the branch file (newest_registry_release() in deckyhub-plugin's main.py): main's as a
# stable release, develop's as a pre-release. Like DeckyHub's own channels, the Stable
# registry channel takes the newest stable release and Pre-release the newest of all.
# The branch files stay what older DeckyHub reads, and every DeckyHub's fallback.
on:
  push:
    branches: [main, develop]
    paths: [registry/apps.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # DeckyHub skips an empty or unknown list and reads the branch instead; don't publish one.
      - run: python3 -c "import json; d = json.load(open('registry/apps.json', encoding='utf-8')); assert d['schemaVersion'] == 1 and d['apps'], 'empty or unknown registry'"
      # Notes from comparing this list with the channel's previous release (scripts/release_notes.py);
      # the release index's stats.json only adds which new plugins are forks.
      - run: |
          if [ "$GITHUB_REF_NAME" = main ]; then filter='map(select(.isPrerelease | not))'; else filter='map(select(.tagName | endswith("-develop")))'; fi
          previous="$(gh release list --limit 100 --json tagName,isPrerelease --jq "$filter | .[0].tagName // empty")"
          old=-
          if [ -n "$previous" ] && gh release download "$previous" -p apps.json -O "$RUNNER_TEMP/previous.json" --clobber; then old="$RUNNER_TEMP/previous.json"; fi
          index="$([ "$GITHUB_REF_NAME" = main ] && echo release-index || echo release-index-develop)"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$index/stats.json" -o "$RUNNER_TEMP/stats.json" || echo '{}' > "$RUNNER_TEMP/stats.json"
          python3 scripts/release_notes.py "$old" registry/apps.json "$RUNNER_TEMP/stats.json" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      # One release per change, so each list stays downloadable as it was published.
      # gh uploads the file before publishing, so a release is never seen without it.
      - run: |
          day="$(date -u +%Y.%m.%d)"
          if [ "$GITHUB_REF_NAME" = main ]; then
            gh release create "registry-$day-$GITHUB_RUN_NUMBER" registry/apps.json --target "$GITHUB_SHA" --latest \
              --title "Registry $day" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "registry-$day-$GITHUB_RUN_NUMBER-develop" registry/apps.json --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Registry $day (develop)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
